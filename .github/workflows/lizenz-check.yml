name: Lizenz-Ablauf-Check (Telegram-Erinnerung)

on:
  schedule:
    # täglich 06:00 UTC = 08:00 Sommerzeit / 07:00 Winterzeit (Europe/Berlin)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur testen, nichts senden/sperren (true/false)'
        required: false
        default: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lizenz-Check ausführen
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_ADMIN_PASSWORD: ${{ secrets.PB_ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > .env <<EOF
          PB_URL=${PB_URL}
          PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
          PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          EOF
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node agents/check-tenant-expiry.js --dry-run
          else
            node agents/check-tenant-expiry.js
          fi
          rm -f .env
