name: Vorlagen-Sync (Superchat → PocketBase)

on:
  schedule:
    # täglich 05:00 UTC = 07:00 Sommerzeit / 06:00 Winterzeit (Europe/Berlin)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur Plan zeigen, nichts schreiben (true/false)'
        required: false
        default: 'false'
      force:
        description: 'Sicherheitsschwelle übergehen — nur nach echtem Aufräumen in Superchat (true/false)'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync ausführen
        env:
          SUPERCHAT_API_KEY: ${{ secrets.SUPERCHAT_API_KEY }}
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_ADMIN_PASSWORD: ${{ secrets.PB_ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # assets/previews/ liegt im Repo — neue Vorlagen bekommen ihr Vorschaubild,
          # bestehende Records werden nicht angefasst (attachPreview überschreibt nie).
          FLAGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "${{ github.event.inputs.force }}" = "true" ] && FLAGS="$FLAGS --force"
          node agents/sync-superchat-to-pb.js $FLAGS
